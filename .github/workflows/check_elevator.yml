name: Check Elevator Battery

on:
  # Запуск: кожні 10 хвилин через cron-job.org (розклад самого GitHub ненадійний)
  # або вручну кнопкою Run workflow у вкладці Actions
  workflow_dispatch:

# Не дозволяємо двом запускам працювати одночасно (інакше можливі дублі повідомлень).
# Якщо новий запуск прийде, поки старий ще працює, — він почекає своєї черги.
concurrency:
  group: elevator-bot
  cancel-in-progress: false

# Вбудованому токену GitHub даємо мінімум прав: лише прочитати код бота.
permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Якщо щось зависло — зупиняємо через 8 хвилин (зазвичай запуск триває ~20 секунд,
    # найгірший випадок, коли все відповідає повільно, — близько 5 хвилин)
    timeout-minutes: 8

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      # Версія закріплена: бібліотека бачить паролі, тож не ставимо щоразу «найновішу» без перевірки
      run: pip install requests==2.34.2

    - name: Run battery check script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        SOLARMAN_APP_ID: ${{ secrets.SOLARMAN_APP_ID }}
        SOLARMAN_APP_SECRET: ${{ secrets.SOLARMAN_APP_SECRET }}
        SOLARMAN_EMAIL: ${{ secrets.SOLARMAN_EMAIL }}
        SOLARMAN_PASSWORD: ${{ secrets.SOLARMAN_PASSWORD }}
        DEVICE_SN: ${{ secrets.DEVICE_SN }}
        GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        TOKEN_GIST_ID: ${{ secrets.TOKEN_GIST_ID }}
      run: python main.py
