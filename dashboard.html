<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ліфт Dmytrivska — стан акумулятора</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ліфт Dmytrivska">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #1a1d2e;
    border-radius: 20px;
    padding: 36px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    text-align: center;
  }

  h1 {
    font-size: 1.1rem;
    color: #888;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .soc-ring {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 28px;
  }

  .soc-ring svg {
    transform: rotate(-90deg);
  }

  .soc-ring .track {
    fill: none;
    stroke: #2a2d3e;
    stroke-width: 12;
  }

  .soc-ring .fill {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s ease, stroke 0.5s;
  }

  .soc-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
  }

  .soc-unit {
    font-size: 1rem;
    color: #888;
    font-weight: 400;
  }

  .status-badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .status-ok     { background: #1a3a2a; color: #4ade80; }
  .status-warn   { background: #3a3010; color: #facc15; }
  .status-orange { background: #3a2010; color: #fb923c; }
  .status-danger { background: #3a1010; color: #f87171; }
  .status-offline{ background: #2a2a2a; color: #9ca3af; }

  /* Блок "коли оновлено" — одразу під статусом, добре видно */
  .fresh {
    background: #23263a;
    border-radius: 14px;
    padding: 14px 16px;
  }
  .fresh-main {
    font-size: 1.15rem;
    font-weight: 600;
    color: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .fresh-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #6b7280;
    flex-shrink: 0;
  }
  .fresh-dot.ok    { background: #4ade80; }
  .fresh-dot.stale { background: #fb923c; }
  .fresh-time {
    font-size: 0.95rem;
    color: #9ca3af;
    margin-top: 6px;
  }

  /* Кнопка виклику консьєржа */
  .sos-btn {
    display: block;
    margin-top: 20px;
    background: #dc2626;
    color: #fff;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 16px 24px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(220,38,38,0.35);
    transition: background 0.2s;
  }
  .sos-btn:hover, .sos-btn:active { background: #b91c1c; }

  .error { color: #f87171; font-size: 0.9rem; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Резервне живлення</h1>

  <div class="soc-ring">
    <svg viewBox="0 0 180 180" width="180" height="180">
      <circle class="track" cx="90" cy="90" r="74"/>
      <circle class="fill" id="ring" cx="90" cy="90" r="74"
        stroke-dasharray="465"
        stroke-dashoffset="465"
        stroke="#4ade80"/>
    </svg>
    <div class="soc-label">
      <span id="soc-value">—</span><span class="soc-unit">%</span>
    </div>
  </div>

  <div id="badge" class="status-badge status-offline">Завантаження...</div>

  <div class="fresh">
    <div class="fresh-main"><span class="fresh-dot" id="fresh-dot"></span><span id="fresh-ago">Завантаження...</span></div>
    <div class="fresh-time" id="fresh-time"></div>
  </div>

  <a class="sos-btn" href="tel:+380990009182">📞 Консьєрж</a>
  <div class="error" id="error"></div>
</div>

<script>
const GIST_ID = "36b8bbe5b5a7b6f0b9b56666643a0b53";
const GIST_URL = `https://api.github.com/gists/${GIST_ID}`;

// Якщо дані старші за стільки хвилин — попереджаємо мешканців, що бот, можливо, не працює
const STALE_MINUTES = 30;

const STATES = {
  0: { label: "✅ Мережа, все добре",   cls: "status-ok",     color: "#4ade80" },
  1: { label: "🟡 Акумулятор",          cls: "status-warn",   color: "#facc15" },
  2: { label: "🟠 Заряд обмежений",     cls: "status-orange", color: "#fb923c" },
  3: { label: "🔴 Критичний заряд!",    cls: "status-danger", color: "#f87171" },
  4: { label: "📡 Зв'язок втрачено",    cls: "status-offline",color: "#9ca3af" },
};

let lastData = null;      // останні отримані дані
let lastFetchAt = 0;      // коли сторінка востаннє зверталась за даними

// "щойно", "7 хв тому", "2 год тому"
function agoText(ts) {
  const sec = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (sec < 60) return "щойно";
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} хв тому`;
  const h = Math.floor(min / 60);
  if (h >= 24) return "понад добу тому";
  return `${h} год тому`;
}

// "сьогодні о 10:30", "вчора о 23:50" або дата
function timeText(ts) {
  const d = new Date(ts * 1000);
  const hm = d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const diffDays = Math.round((today - day) / 86400000);
  if (diffDays === 0) return `сьогодні о ${hm}`;
  if (diffDays === 1) return `вчора о ${hm}`;
  return d.toLocaleDateString("uk-UA") + ` о ${hm}`;
}

// Малює сторінку з останніх даних (викликається і після завантаження, і щохвилини)
function render() {
  if (!lastData) return;
  const soc  = lastData.last_soc ?? null;
  const st   = lastData.state ?? 0;
  const ts   = lastData.last_update ?? null;
  const info = STATES[st] ?? STATES[0];
  const stale = ts !== null && st !== 4 &&
                (Date.now() / 1000 - ts) > STALE_MINUTES * 60;

  // Кільце із зарядом
  const socEl = document.getElementById("soc-value");
  const ring  = document.getElementById("ring");
  if (soc !== null && st !== 4) {
    socEl.textContent = Math.round(soc);
    ring.style.strokeDashoffset = 465 - (soc / 100) * 465;
    ring.style.stroke = stale ? "#9ca3af" : info.color;
  } else {
    socEl.textContent = "—";
    ring.style.strokeDashoffset = 465;
  }

  // Статус
  let label = info.label;
  if (st === 0 && soc !== null && soc < 100) label = "⚡ Мережа (Заряджається)";
  if (stale) label = "⚠️ Дані застарілі";
  const badge = document.getElementById("badge");
  badge.textContent = label;
  badge.className = "status-badge " + (stale ? "status-offline" : info.cls);

  // Коли оновлено
  if (ts) {
    document.getElementById("fresh-ago").textContent = "Оновлено " + agoText(ts);
    document.getElementById("fresh-time").textContent = timeText(ts);
    document.getElementById("fresh-dot").className = "fresh-dot " + (stale ? "stale" : "ok");
  }
}

async function loadData() {
  lastFetchAt = Date.now();
  try {
    const res = await fetch(`${GIST_URL}?nocache=${new Date().getTime()}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const gist = await res.json();
    lastData = JSON.parse(gist.files["state.json"].content);
    document.getElementById("error").textContent = "";
    render();
  } catch (e) {
    // Старі дані лишаються на екрані, лише показуємо помилку
    document.getElementById("error").textContent = "Не вдалося оновити: " + e.message;
  }
}

loadData();
// Нові дані — кожні 10 хвилин (бот теж оновлює їх раз на 10 хвилин)
setInterval(loadData, 600000);
// "N хв тому" перераховуємо щохвилини без звернення до сервера
setInterval(render, 60000);
// Коли мешканець повертається до відкритої сторінки — одразу підтягуємо свіжі дані
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastFetchAt > 60000) loadData();
});
</script>
</body>
</html>
